name: Deploy MCP registry to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("site/v0.1/servers")
          assert (root / "index.json").read_bytes() == (root / "index.html").read_bytes()
          index = json.loads((root / "index.json").read_text())
          assert index["metadata"]["count"] == len(index["servers"])
          names = set()
          for entry in index["servers"]:
              server = entry["server"]
              name, version = server["name"], server["version"]
              assert name not in names, f"Duplicate server: {name}"
              names.add(name)
              versions = root / name / "versions"
              assert json.loads((versions / "latest").read_text()) == entry, name
              assert json.loads((versions / version).read_text()) == entry, name
          for path in root.glob("**/versions/*"):
              json.loads(path.read_text())
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
