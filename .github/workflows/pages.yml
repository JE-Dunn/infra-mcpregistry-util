name: Deploy MCP registry to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry JSON
        run: |
          for f in site/v0.1/servers/index.json site/v0.1/servers/index.html \
                   site/v0.1/servers/io.github.microsoft/workiq/versions/*; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done
          cmp site/v0.1/servers/index.json site/v0.1/servers/index.html
          latest_version=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["server"]["version"])' < site/v0.1/servers/io.github.microsoft/workiq/versions/latest)
          cmp site/v0.1/servers/io.github.microsoft/workiq/versions/latest \
              "site/v0.1/servers/io.github.microsoft/workiq/versions/$latest_version"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
